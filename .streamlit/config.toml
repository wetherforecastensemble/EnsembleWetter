[server]
enableStaticServing = false
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "viewer"
showErrorDetails = false
showSidebarNavigation = false

[theme]
base = "light"
primaryColor = "#2e86c1"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f5f8"
textColor = "#1a3a5c"
font = "sans serif"
